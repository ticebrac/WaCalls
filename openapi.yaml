components:
  securitySchemes:
    apiKeyHeader:
      type: apiKey
      in: header
      name: apikey
      description: |
        Chave única do servidor (flag `-api-key`), exigida em `/api/crm/*` e
        nas rotas Evolution. `Authorization: Bearer <chave>` também é aceito.
    userIdHeader:
      type: apiKey
      in: header
      name: X-User-Id
      description: |
        Identidade do colaborador. Define de quem é cada lead e cada ligação,
        e filtra os eventos do SSE.

  parameters:
    sid:
      name: sid
      in: path
      required: true
      schema: { type: string }
      description: ID da instância (session)
    phone:
      name: phone
      in: path
      required: true
      schema: { type: string }
      description: Número do lead (dígitos com 55; pontuação e + são ignorados)
    clientId:
      name: X-Client-Id
      in: header
      required: false
      schema: { type: string }
      description: |
        Identidade do operador no painel (também aceito como query `clientId`).
        Usada para limite de "uma ligação por operador" e dono das ligações.
    instance:
      name: instance
      in: path
      required: true
      schema: { type: string }
      description: Nome da instância (é o ID da session no painel)

  responses:
    InvalidKey:
      description: Chave inválida ou ausente (403)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    MissingUser:
      description: Header X-User-Id ausente (400)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Disabled:
      description: "API desabilitada — iniciar o servidor com -api-key (503)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    # --- Evolution -----------------------------------------------------------
    EvoInvalidKey:
      description: Chave inválida ou ausente (403)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/EvoError" }
    EvoBadRequest:
      description: Body inválido ou dados ausentes (400)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/EvoError" }
    EvoNotFound:
      description: Instância não encontrada (404)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/EvoError" }
    EvoInternal:
      description: Erro interno (500)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/EvoError" }
    EvoStatusOk:
      description: Operação concluída
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string, enum: [success] }
    EvoMessage:
      description: Mensagem aceita para envio (201)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/EvoMessageResponse" }
    EvoInvite:
      description: Código de convite
      content:
        application/json:
          schema:
            type: object
            properties:
              inviteCode: { type: string }
              inviteUrl: { type: string }
    EvoParticipants:
      description: Participantes resultantes
      content:
        application/json:
          schema:
            type: object
            properties:
              participants:
                type: array
                items: { $ref: "#/components/schemas/GroupParticipant" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Mensagem legível do problema
    SentMessage:
      type: object
      properties:
        id: { type: string, description: ID da mensagem no WhatsApp }
        timestamp: { type: integer, format: int64, description: Epoch ms }
    NumberCheck:
      type: object
      properties:
        exists: { type: boolean }
        jid: { type: string }
        number: { type: string }
        name: { type: string, description: Nome verificado (quando disponível) }

    # --- Evolution -----------------------------------------------------------
    EvoError:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, enum: [false] }
        error:
          type: object
          properties:
            code:
              type: string
              description: "BAD_REQUEST | FORBIDDEN | NOT_FOUND | CONFLICT | INTERNAL | SERVICE_UNAVAILABLE"
            message: { type: string }
    EvoMessageResponse:
      type: object
      properties:
        key:
          type: object
          properties:
            remoteJid: { type: string }
            fromMe: { type: boolean, enum: [true] }
            id: { type: string }
        messageTimestamp:
          type: string
          description: Segundos Unix como string
        status:
          type: string
          enum: [PENDING]
    InstanceListItem:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        instanceName: { type: string, description: Igual ao id }
        state: { type: string }
        integration: { type: string, enum: [whatsmeow] }
        number: { type: string }
        owner: { type: string, description: JID da conta }
        profileName: { type: string }
        totalChat: { type: integer }
        totalChatWithoutMessage: { type: integer }
    MessageKey:
      type: object
      required: [id]
      properties:
        id: { type: string }
        remoteJid: { type: string }
        fromMe: { type: boolean }
        participant: { type: string }
    GroupParticipant:
      type: object
      properties:
        id: { type: string }
        admin: { type: string, enum: [superadmin, admin, ""] }
        isAdmin: { type: boolean }
        isSuper: { type: boolean }
    GroupInfo:
      type: object
      properties:
        id: { type: string }
        subject: { type: string }
        owner: { type: string }
        size: { type: integer }
        participants:
          type: array
          items: { $ref: "#/components/schemas/GroupParticipant" }
    GroupParticipantsReq:
      type: object
      required: [participants]
      properties:
        groupJid: { type: string, description: JID do grupo (ou use number) }
        number: { type: string, description: JID do grupo (alternativa) }
        participants:
          type: array
          items: { type: string }
    WebhookConfig:
      type: object
      properties:
        enabled: { type: boolean }
        url: { type: string }
        webhookByEvents: { type: boolean }
        events:
          type: array
          items: { type: string }
    WebhookEnvelope:
      type: object
      properties:
        webhooks:
          oneOf:
            - $ref: "#/components/schemas/WebhookConfig"
            - type: object
              description: Objeto vazio quando não há webhook configurado
    SessionInfo:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        jid:
          type: string
          description: JID da conta pareada ("" quando não pareada)
        state:
          type: string
          description: "Estados: connecting, open, qr, logged_out, ..."
        paired: { type: boolean }
    PairingState:
      type: object
      properties:
        state: { type: string }
        paired: { type: boolean }
        qr:
          type: string
          description: String QR do WhatsApp (presente enquanto não pareada)
        qrBase64:
          type: string
          description: data URL PNG pronta para exibir em <img>
    Lead:
      type: object
      properties:
        phone:
          type: string
          description: Número normalizado com DDI 55
          example: "5541991235566"
        name: { type: string }
        owner:
          type: string
          description: X-User-Id do colaborador que assumiu (dono fixo)
        sessionId:
          type: string
          description: Instância usada para falar com este lead
        createdAt:
          type: integer
          format: int64
    StoredMessage:
      type: object
      properties:
        id: { type: string }
        sessionId: { type: string }
        chatJid:
          type: string
          example: "5541991235566@s.whatsapp.net"
        senderJid: { type: string }
        fromMe: { type: boolean }
        type:
          type: string
          description: "text, ptt, audio, image, video, document, sticker, call_recording, ..."
        text: { type: string }
        fileName: { type: string }
        mimeType: { type: string }
        mediaUrl:
          type: string
          description: Caminho relativo do mídia baixado (/api/media/...)
        status:
          type: string
          description: "PENDING, DELIVERED, READ, PLAYED, INTERNAL"
        timestamp:
          type: integer
          format: int64
        pushName: { type: string }
    LiveCall:
      type: object
      description: Ligação ativa (broker em memória)
      properties:
        sessionId: { type: string }
        callId: { type: string }
        owner:
          type: string
          nullable: true
        direction: { type: string, enum: [outbound, inbound] }
        peer: { type: string, example: "5541991235566@s.whatsapp.net" }
        startedAt: { type: integer, format: int64 }
        status:
          type: string
          enum: [starting, ringing, connected, ended]
        endedAt: { type: integer, format: int64 }
        endReason: { type: string }
    CallLog:
      type: object
      description: Registro persistido de uma ligação (histórico)
      properties:
        sessionId: { type: string }
        callId: { type: string }
        direction: { type: string, enum: [outbound, inbound] }
        peer: { type: string }
        owner: { type: string }
        startedAt: { type: integer, format: int64 }
        endedAt: { type: integer, format: int64 }
        durationMs: { type: integer, format: int64 }
        recordingMs: { type: integer, format: int64 }
        endReason:
          type: string
          description: "user_ended, timeout, enc, busy, failed, declined, ..."
        recordingUrl:
          type: string
          description: Gravação (relativa; prefixar com a base URL) — somente quando houve gravação
    ChatSummary:
      type: object
      properties:
        sessionId: { type: string }
        jid: { type: string }
        name: { type: string }
        isGroup: { type: boolean }
        unread: { type: integer }
        lastText: { type: string }
        lastType: { type: string }
        lastFromMe: { type: boolean }
        lastAt: { type: integer, format: int64 }
