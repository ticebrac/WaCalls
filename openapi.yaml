openapi: 3.1.0
info:
  title: WaCebrac API
  version: 1.0.0
  description: |
    API completa do WaCebrac — gateway WhatsApp com ligações VoIP, gravações e
    integração de CRM.

    Três superfícies coexistem:

    | Superfície | Rotas | Autenticação |
    |---|---|---|
    | **CRM** | `/api/crm/*` | obrigatória: `apikey` + `X-User-Id` |
    | **Painel** | `/api/*` (sessions, chats, calls, events) | nenhuma (identidade por `X-Client-Id`) |
    | **Evolution** | `/instance`, `/message`, `/chat`, `/group`, `/webhook` | `apikey` (header `apikey` ou `Authorization: Bearer`) |

    A chave é definida uma única vez no start do servidor (`-api-key`) e vale
    para o CRM e para a Evolution. Sem ela, `/api/crm/*` responde 503 e as
    rotas Evolution ficam sem exigência de chave.

    Guia humano com exemplos e fluxos: `API-CRM.md` (CRM) e `API.md` (geral).
  contact:
    name: WaCebrac
servers:
  - url: http://localhost:11000
    description: Servidor local padrão
tags:
  - name: CRM
    description: API para o CRM (coletar, monitorar e executar)
  - name: Sessions
    description: Instâncias/contas WhatsApp (painel)
  - name: Chats
    description: Conversas e mensagens (painel)
  - name: Calls
    description: Ligações e gravações (painel)
  - name: Events
    description: Eventos em tempo real (SSE)
  - name: Evolution
    description: API compatível com Evolution (instâncias, mensagens, grupos, webhooks)

security:
  - apiKeyHeader: []

paths:
  # ==========================================================================
  # CRM — coletar, monitorar e executar (ver API-CRM.md)
  # ==========================================================================
  /api/crm/status:
    get:
      tags: [CRM]
      summary: Estado para o CRM (origem do colaborador, instances, ligações ativas)
      security:
        - apiKeyHeader: []
          userIdHeader: []
      responses:
        "200":
          description: Estado atual
          content:
            application/json:
              schema:
                type: object
                properties:
                  origin:
                    type: string
                    description: Instância de origem do colaborador ("" se não definida)
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/SessionInfo"
                  activeCalls:
                    type: array
                    items:
                      $ref: "#/components/schemas/LiveCall"
        "400": { $ref: "#/components/responses/MissingUser" }
        "403": { $ref: "#/components/responses/InvalidKey" }
        "503": { $ref: "#/components/responses/Disabled" }

  /api/crm/events:
    get:
      tags: [CRM]
      summary: Eventos em tempo real filtrados pelo colaborador
      description: |
        Stream SSE (`text/event-stream`) com keepalive `: ping` a cada 20 s.
        Entrega apenas: `session-list`, `auth-state`, `session-qr`,
        `message` (de leads do colaborador), `call-status`/`call-ended`
        (com `owner` do colaborador) e `call-list` (já filtrado).
        Outros eventos do servidor são descartados.
      security:
        - apiKeyHeader: []
          userIdHeader: []
      responses:
        "200":
          description: Fluxo de eventos Server-Sent Events
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Cada evento é uma linha `data: {json}\n\n`. Exemplos:

                  `data: {"type":"message","sessionId":"...","message":{...}}`

                  `data: {"type":"call-status","id":"...","status":"ringing","owner":"ana.paula",...}`
        "400": { $ref: "#/components/responses/MissingUser" }
        "403": { $ref: "#/components/responses/InvalidKey" }
        "503": { $ref: "#/components/responses/Disabled" }

  /api/crm/sessions:
    get:
      tags: [CRM]
      summary: Lista as instâncias WhatsApp
      security:
        - apiKeyHeader: []
          userIdHeader: []
      responses:
        "200":
          description: Instâncias
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/SessionInfo"
        "400": { $ref: "#/components/responses/MissingUser" }
        "403": { $ref: "#/components/responses/InvalidKey" }
        "503": { $ref: "#/components/responses/Disabled" }
    post:
      tags: [CRM]
      summary: Cria uma instância e inicia o pareamento (QR)
      security:
        - apiKeyHeader: []
          userIdHeader: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  default: Session
                  description: Nome exibido da instância
      responses:
        "200":
          description: Instância criada; consulte GET /api/crm/sessions/{sid}/qr
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Identificador da instância (usar em todos os caminhos {sid})
        "400": { $ref: "#/components/responses/MissingUser" }
        "403": { $ref: "#/components/responses/InvalidKey" }
        "500":
          description: Falha ao criar (pairing não iniciou)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/Disabled" }

  /api/crm/sessions/{sid}:
    parameters:
      - $ref: "#/components/parameters/sid"
    patch:
      tags: [CRM]
      summary: Renomeia a instância
      security:
        - apiKeyHeader: []
          userIdHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "204": { description: Renomeada }
        "400":
          description: Nome vazio ou body inválido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Instância inexistente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/InvalidKey" }
        "503": { $ref: "#/components/responses/Disabled" }
    delete:
      tags: [CRM]
      summary: Desconecta e exclui a instância
      security:
        - apiKeyHeader: []
          userIdHeader: []
      responses:
        "204": { description: Excluída (logout no WhatsApp + remoção local) }
        "404":
          description: Instância inexistente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/InvalidKey" }
        "503": { $ref: "#/components/responses/Disabled" }

  /api/crm/sessions/{sid}/qr:
    get:
      tags: [CRM]
      summary: QR code de pareamento
      security:
        - apiKeyHeader: []
          userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/sid"
      responses:
        "200":
          description: Estado do pareamento
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PairingState" }
        "404":
          description: Instância inexistente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/InvalidKey" }
        "503": { $ref: "#/components/responses/Disabled" }

  /api/crm/sessions/{sid}/disconnect:
    post:
      tags: [CRM]
      summary: Desconecta a instância (mantém para novo pareamento)
      security:
        - apiKeyHeader: []
          userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/sid"
      responses:
        "204": { description: Desconectada (estado "logged_out"; use POST .../sessions ou o painel para re-parear) }
        "404":
          description: Instância inexistente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/InvalidKey" }
        "503": { $ref: "#/components/responses/Disabled" }

  /api/crm/origin:
    get:
      tags: [CRM]
      summary: Instância de origem do colaborador autenticado
      security:
        - apiKeyHeader: []
          userIdHeader: []
      responses:
        "200":
          description: Origem atual
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId:
                    type: string
                    description: String vazia quando nao definida
        "400": { $ref: "#/components/responses/MissingUser" }
        "403": { $ref: "#/components/responses/InvalidKey" }
        "503": { $ref: "#/components/responses/Disabled" }
    put:
      tags: [CRM]
      summary: Define a instância de origem do colaborador
      description: |
        Instância usada para falar com os leads DESTE colaborador. Os leads
        herdam a origem no momento em que são criados; leads já criados
        permanecem na instância onde nasceram.
      security:
        - apiKeyHeader: []
          userIdHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId:
                  type: string
      responses:
        "204": { description: Origem definida }
        "400":
          description: sessionId ausente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Instância inexistente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/InvalidKey" }
        "503": { $ref: "#/components/responses/Disabled" }
    delete:
      tags: [CRM]
      summary: Limpa a origem do colaborador
      security:
        - apiKeyHeader: []
          userIdHeader: []
      responses:
        "204": { description: Origem removida }
        "403": { $ref: "#/components/responses/InvalidKey" }
        "503": { $ref: "#/components/responses/Disabled" }

  /api/crm/leads:
    get:
      tags: [CRM]
      summary: Leads do colaborador autenticado
      security:
        - apiKeyHeader: []
          userIdHeader: []
      responses:
        "200":
          description: Leads com dono = X-User-Id (mais recentes primeiro)
          content:
            application/json:
              schema:
                type: object
                properties:
                  leads:
                    type: array
                    items:
                      $ref: "#/components/schemas/Lead"
        "400": { $ref: "#/components/responses/MissingUser" }
        "403": { $ref: "#/components/responses/InvalidKey" }
        "503": { $ref: "#/components/responses/Disabled" }
    post:
      tags: [CRM]
      summary: Assume um lead (chamar ao abrir o modal)
      description: |
        Registra o lead com dono fixo = `X-User-Id` e instância de origem do
        colaborador. Idempotente: se já for seu, devolve o mesmo; se for de
        outro, responde 403.
      security:
        - apiKeyHeader: []
          userIdHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  example: "(41) 99123-5566"
                  description: Número do lead (com ou sem +55; pontuação é ignorada)
                name:
                  type: string
                  description: Nome do lead (guardado quando vazio)
      responses:
        "200":
          description: Lead (assumido ou já existente)
          content:
            application/json:
              schema:
                type: object
                properties:
                  lead:
                    $ref: "#/components/schemas/Lead"
        "400":
          description: phone ausente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Lead pertence a outro colaborador, ou chave apikey inválida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Colaborador sem instância de origem (PUT /api/crm/origin)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Erro interno
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/Disabled" }

  /api/crm/leads/{phone}:
    delete:
      tags: [CRM]
      summary: Libera a atribuição de um lead
      description: Remove o claim; o número volta a poder ser assumido por qualquer colaborador.
      security:
        - apiKeyHeader: []
          userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/phone"
      responses:
        "204": { description: Claim removido }
        "404":
          description: Nenhum lead para este número
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/InvalidKey" }
        "503": { $ref: "#/components/responses/Disabled" }

  /api/crm/leads/{phone}/messages:
    parameters:
      - $ref: "#/components/parameters/phone"
    get:
      tags: [CRM]
      summary: Conversa do lead (botão "Conversar com o lead")
      description: |
        Assume o lead automaticamente se ainda não tiver dono. As mensagens
        vêm em ordem **crescente** (mais antiga em cima), prontas para render.
      security:
        - apiKeyHeader: []
          userIdHeader: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: before
          in: query
          description: Timestamp (ms) da última mensagem que o cliente já tem — pagina para trás
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Conversa
          content:
            application/json:
              schema:
                type: object
                properties:
                  lead:
                    $ref: "#/components/schemas/Lead"
                  messages:
                    type: array
                    items:
                      $ref: "#/components/schemas/StoredMessage"
        "400":
          description: phone ausente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Lead de outro colaborador (ou chave inválida)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Instância do lead foi excluída
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Sem instância de origem
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Erro interno
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/Disabled" }
    post:
      tags: [CRM]
      summary: Envia uma mensagem para o lead
      security:
        - apiKeyHeader: []
          userIdHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
      responses:
        "200":
          description: Mensagem enviada
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  timestamp: { type: integer, format: int64 }
        "400":
          description: text ausente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Lead de outro colaborador (ou chave inválida)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Instância do lead não existe mais
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Sem instância de origem
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Falha no envio
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Instância não pareada (ou API desabilitada)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/crm/calls:
    get:
      tags: [CRM]
      summary: Histórico de ligações do colaborador
      security:
        - apiKeyHeader: []
          userIdHeader: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 500 }
      responses:
        "200":
          description: Ligações iniciadas por este colaborador (mais recentes primeiro)
          content:
            application/json:
              schema:
                type: object
                properties:
                  calls:
                    type: array
                    items:
                      $ref: "#/components/schemas/CallLog"
        "400": { $ref: "#/components/responses/MissingUser" }
        "403": { $ref: "#/components/responses/InvalidKey" }
        "500":
          description: Erro interno
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/Disabled" }
    post:
      tags: [CRM]
      summary: Liga para o lead (botão "Ligar via WhatsApp")
      description: |
        Assume o lead (mesmas regras do POST /leads) e disca da instância de
        origem do colaborador. `owner` da ligação = `X-User-Id`, o que limita
        uma ligação ativa por colaborador (409) e define o histórico.
      security:
        - apiKeyHeader: []
          userIdHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, example: "(41) 99123-5566" }
                name: { type: string, description: Nome usado se o lead ainda não existir }
                record:
                  type: boolean
                  default: true
                  description: Gravar a ligação
                duration_ms:
                  type: integer
                  default: 300000
                  description: Duração máxima em milissegundos
      responses:
        "200":
          description: Ligação iniciada (estado "ringing")
          content:
            application/json:
              schema:
                type: object
                properties:
                  call:
                    type: object
                    properties:
                      callId: { type: string }
                      sessionId: { type: string }
        "400":
          description: phone ausente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Lead de outro colaborador (ou chave inválida)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Instância do lead não existe mais
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "Sem instância de origem, ou o colaborador já está em ligação"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Limite de ligações simultâneas na sessão
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Falha ao iniciar (oferta não pôde ser enviada)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Instância não pareada (ou API desabilitada)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/crm/calls/{id}/end:
    post:
      tags: [CRM]
      summary: Encerra uma ligação ativa do colaborador
      security:
        - apiKeyHeader: []
          userIdHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: callId devolvido por POST /api/crm/calls
      responses:
        "204": { description: Encerrada }
        "403":
          description: Ligação de outro colaborador (ou chave inválida)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Ligação inexistente (ou sessão removida)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/Disabled" }

  # ==========================================================================
  # PAINEL — rotas usadas pela SPA operador (sem autenticação)
  # ==========================================================================
  /api/sessions:
    get:
      tags: [Sessions]
      summary: Lista as instâncias
      responses:
        "200":
          description: Instâncias
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/SessionInfo" }
    post:
      tags: [Sessions]
      summary: Cria uma instância e inicia o pareamento
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, default: Session }
      responses:
        "200":
          description: Instância criada
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
        "500":
          description: Falha ao criar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/sessions/{sid}:
    parameters:
      - $ref: "#/components/parameters/sid"
    delete:
      tags: [Sessions]
      summary: Exclui a instância (logout + remoção local)
      responses:
        "204": { description: Excluída }
        "404":
          description: Instância inexistente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/sessions/{sid}/qr:
    get:
      tags: [Sessions]
      summary: QR code de pareamento
      parameters:
        - $ref: "#/components/parameters/sid"
      responses:
        "200":
          description: Estado do pareamento
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PairingState" }
        "404":
          description: Instância inexistente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/sessions/{sid}/logout:
    post:
      tags: [Sessions]
      summary: Desconecta a instância
      parameters:
        - $ref: "#/components/parameters/sid"
      responses:
        "204": { description: Desconectada }
        "404":
          description: Instância inexistente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/sessions/{sid}/pair:
    post:
      tags: [Sessions]
      summary: Reinicia o pareamento (novo QR)
      parameters:
        - $ref: "#/components/parameters/sid"
      responses:
        "204": { description: Pareamento reiniciado }
        "400":
          description: Instância já pareada ou falha no pairing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Instância inexistente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/sessions/{sid}/calls:
    parameters:
      - $ref: "#/components/parameters/sid"
    post:
      tags: [Calls]
      summary: Inicia uma ligação (leg do navegador faz o /webrtc em seguida)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, example: "5541991235566" }
                duration_ms: { type: integer, default: 300000 }
                record: { type: boolean, default: true }
      responses:
        "200":
          description: Ligação iniciada (ringing)
          content:
            application/json:
              schema:
                type: object
                properties:
                  call:
                    type: object
                    properties:
                      callId: { type: string }
        "400":
          description: phone ausente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Instância inexistente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Operador já em ligação (X-Client-Id)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Limite de ligações simultâneas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Falha ao iniciar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Instância não pareada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      tags: [Calls]
      summary: Histórico de ligações da instância
      parameters:
        - $ref: "#/components/parameters/sid"
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 500 }
        - name: peer
          in: query
          description: Número do contato (normalizado com 55)
          schema: { type: string }
      responses:
        "200":
          description: Registros persistidos (com gravação quando houver)
          content:
            application/json:
              schema:
                type: object
                properties:
                  calls:
                    type: array
                    items: { $ref: "#/components/schemas/CallLog" }
        "404":
          description: Instância inexistente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/sessions/{sid}/calls/{id}:
    parameters:
      - $ref: "#/components/parameters/sid"
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Calls]
      summary: Um registro de ligação (sem envelope)
      responses:
        "200":
          description: Registro
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallLog" }
        "404":
          description: Ligação inexistente ou instância inexistente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [Calls]
      summary: Encerra a ligação ativa
      responses:
        "204": { description: Encerrada }
        "404":
          description: Instância inexistente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/sessions/{sid}/calls/{id}/webrtc:
    post:
      tags: [Calls]
      summary: Troca SDP browser ↔ ponte (oferta do navegador, resposta do servidor)
      parameters:
        - $ref: "#/components/parameters/sid"
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sdp_offer]
              properties:
                sdp_offer: { type: string, description: SDP de RTCPeerConnection.createOffer() }
      responses:
        "200":
          description: Resposta SDP
          content:
            application/json:
              schema:
                type: object
                properties:
                  sdp_answer: { type: string }
        "400":
          description: sdp_offer ausente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Ligação ou instância inexistente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Falha na ponte WebRTC
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/sessions/{sid}/calls/{id}/accept:
    post:
      tags: [Calls]
      summary: Aceita uma ligação recebida
      parameters:
        - $ref: "#/components/parameters/sid"
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/clientId"
      responses:
        "200":
          description: Aceita
          content:
            application/json:
              schema:
                type: object
                properties:
                  call:
                    type: object
                    properties:
                      callId: { type: string }
        "404":
          description: Ligação ou instância inexistente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Operador já em outra ligação ou chamada já reivindicada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Falha ao aceitar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/sessions/{sid}/calls/{id}/reject:
    post:
      tags: [Calls]
      summary: Rejeita uma ligação recebida
      parameters:
        - $ref: "#/components/parameters/sid"
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Rejeitada
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
        "404":
          description: Instância inexistente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/sessions/{sid}/history:
    get:
      tags: [Calls]
      summary: Histórico recente em memória (últimas 50)
      parameters:
        - $ref: "#/components/parameters/sid"
      responses:
        "200":
          description: Linhas do histórico
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items: { $ref: "#/components/schemas/LiveCall" }
        "404":
          description: Instância inexistente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/recordings/{sid}/{file}:
    get:
      tags: [Calls]
      summary: Download da gravação (.wav)
      parameters:
        - $ref: "#/components/parameters/sid"
        - name: file
          in: path
          required: true
          schema: { type: string, pattern: "^[^/\\\\]+\\.wav$" }
      responses:
        "200":
          description: Áudio WAV
          content:
            audio/wav:
              schema: { type: string, format: binary }
        "404":
          description: Arquivo inexistente ou nome inválido (travessia de diretório bloqueada)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/sessions/{sid}/chats:
    get:
      tags: [Chats]
      summary: Lista de conversas (mais ativa primeiro)
      parameters:
        - $ref: "#/components/parameters/sid"
      responses:
        "200":
          description: Conversas
          content:
            application/json:
              schema:
                type: object
                properties:
                  chats:
                    type: array
                    items: { $ref: "#/components/schemas/ChatSummary" }
        "404":
          description: Instância inexistente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/sessions/{sid}/messages:
    get:
      tags: [Chats]
      summary: Mensagens de uma conversa
      description: |
        A resposta vem em ordem **decrescente** (mais nova primeiro). O painel
        inverte no cliente (`stores/chats.ts`) para renderizar de cima para
        baixo; integrações devem ordenar por `timestamp` como preferirem.
      parameters:
        - $ref: "#/components/parameters/sid"
        - name: chat
          in: query
          required: true
          schema: { type: string }
          description: "JID da conversa (ex.: 5541991235566@s.whatsapp.net)"
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: before
          in: query
          description: Timestamp (ms) — pagina para mensagens anteriores
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Mensagens (mais nova primeiro)
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items: { $ref: "#/components/schemas/StoredMessage" }
        "400":
          description: Query chat ausente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Instância inexistente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

    post:
      tags: [Chats]
      summary: Envia mensagem de texto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                number: { type: string, description: Número (alternativa a chatJid) }
                chatJid: { type: string, description: JID completo (tem prioridade) }
                text: { type: string }
      responses:
        "200":
          description: Enviada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SentMessage" }
        "400":
          description: text ou destinatário ausente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Instância inexistente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Falha no envio
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Instância não pareada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/sessions/{sid}/messages/media:
    post:
      tags: [Chats]
      summary: Envia mídia (base64 ou URL)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [media]
              properties:
                number: { type: string }
                chatJid: { type: string }
                mediatype:
                  type: string
                  default: image
                  enum: [image, video, audio, document, sticker]
                media:
                  type: string
                  description: |
                    base64 puro, data URI (`data:<mime>;base64,...`) ou URL
                    `http(s)://...`. Máximo 64 MB.
                caption: { type: string }
                fileName: { type: string }
                ptt:
                  type: boolean
                  description: "true = nota de voz (áudio vira OGG/Opus no servidor quando -api-key/ffmpeg disponíveis)"
                gifPlayback: { type: boolean }
                seconds:
                  type: integer
                  description: Duração em segundos para áudio/PTT
      responses:
        "200":
          description: Enviada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SentMessage" }
        "400":
          description: media/destinatário ausente ou mediatype inválido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Instância inexistente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Falha no envio/upload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Instância não pareada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/sessions/{sid}/messages/contact:
    post:
      tags: [Chats]
      summary: Envia um cartão de contato
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone]
              properties:
                number: { type: string }
                chatJid: { type: string }
                name: { type: string }
                phone: { type: string }
      responses:
        "200":
          description: Enviado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SentMessage" }
        "400":
          description: Dados ausentes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Instância inexistente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Falha no envio
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Instância não pareada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/sessions/{sid}/chats/read:
    post:
      tags: [Chats]
      summary: Marca a conversa como lida
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chatJid]
              properties:
                chatJid: { type: string }
      responses:
        "200":
          description: Marcada
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
        "400":
          description: chatJid ausente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Instância inexistente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/sessions/{sid}/presence:
    post:
      tags: [Chats]
      summary: Envia presença (digitando, gravando áudio, online/offline)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                jid: { type: string, description: Contato alvo; vazio = presence da conta }
                state:
                  type: string
                  description: '"recording" | "paused" | qualquer outro = digitando'
      responses:
        "200":
          description: Presença enviada
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
        "404":
          description: Instância inexistente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/sessions/{sid}/check-number:
    post:
      tags: [Chats]
      summary: Verifica números registrados no WhatsApp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                numbers:
                  type: array
                  items: { type: string }
                number: { type: string, description: Um número (alternativa a numbers) }
      responses:
        "200":
          description: Resultado por número
          content:
            application/json:
              schema:
                type: object
                properties:
                  numbers:
                    type: array
                    items: { $ref: "#/components/schemas/NumberCheck" }
        "400":
          description: numbers ausente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Instância inexistente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/sessions/{sid}/profile-picture:
    post:
      tags: [Chats]
      summary: Foto de perfil de um contato
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jid]
              properties:
                jid: { type: string }
      responses:
        "200":
          description: URL da foto ("" quando indisponível)
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
        "400":
          description: jid ausente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Instância inexistente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/media/{sid}/{file}:
    get:
      tags: [Chats]
      summary: Download de mídia recebida
      parameters:
        - $ref: "#/components/parameters/sid"
        - name: file
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Arquivo de mídia
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404":
          description: Arquivo inexistente ou nome inválido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/events:
    get:
      tags: [Events]
      summary: Eventos em tempo real do painel (SSE)
      description: |
        `text/event-stream` com keepalive `: ping` a cada 20 s. Eventos:
        `session-list`, `auth-state`, `session-qr`, `message`, `message-status`,
        `message-media`, `presence`, `chat-presence`, `call-status`,
        `call-ended`, `call-list`, `incoming`, `incoming-claimed`.
        Um snapshot inicial é enviado ao conectar.
      parameters:
        - $ref: "#/components/parameters/clientId"
      responses:
        "200":
          description: 'Fluxo SSE (formato data: {json} seguido de linha em branco; keepalive com ": ping")'
          content:
            text/event-stream:
              schema: { type: string }
        "500":
          description: Streaming não suportado pelo handler
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }


  # ==========================================================================
  # EVOLUTION — API compatível com Evolution API v2 (chave obrigatória)
  # ==========================================================================
  /instance/create:
    post:
      tags: [Evolution]
      summary: Cria uma instância (session) com nome próprio
      security:
        - apiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instanceName]
              properties:
                instanceName: { type: string }
                integration: { type: string }
                webhook:
                  $ref: "#/components/schemas/WebhookConfig"
      responses:
        "201":
          description: Criada (hash.apikey devolve a chave usada)
          content:
            application/json:
              schema:
                type: object
                properties:
                  instance:
                    type: object
                    properties:
                      instanceName: { type: string }
                      status: { type: string, enum: [created] }
                  hash:
                    type: object
                    properties:
                      apikey: { type: string }
                      instanceName: { type: string }
        "400": { $ref: "#/components/responses/EvoBadRequest" }
        "403": { $ref: "#/components/responses/EvoInvalidKey" }
        "409":
          description: Instância já existe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvoError" }
        "500": { $ref: "#/components/responses/EvoInternal" }

  /instance/fetchInstances:
    get:
      tags: [Evolution]
      summary: Lista as instâncias
      security:
        - apiKeyHeader: []
      responses:
        "200":
          description: Instâncias
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/InstanceListItem" }
        "403": { $ref: "#/components/responses/EvoInvalidKey" }

  /instance/connect/{instance}:
    get:
      tags: [Evolution]
      summary: Obtém o QR de pareamento (polling até conectar)
      security:
        - apiKeyHeader: []
      parameters:
        - $ref: "#/components/parameters/instance"
      responses:
        "200":
          description: "QR (pairing=true, count=1) ou já conectado (pairing=false, count=0)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  pairing: { type: boolean }
                  code: { type: string, description: String QR (vazio se conectado) }
                  base64: { type: string, description: data URL PNG (vazio se conectado) }
                  count: { type: integer, description: "0 = conectado; 1 = aguardando scan" }
        "403": { $ref: "#/components/responses/EvoInvalidKey" }
        "404": { $ref: "#/components/responses/EvoNotFound" }
        "500": { $ref: "#/components/responses/EvoInternal" }
        "503":
          description: QR ainda não pronto (repetir em instantes)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvoError" }

  /instance/connectionState/{instance}:
    get:
      tags: [Evolution]
      summary: Estado da conexão
      security:
        - apiKeyHeader: []
      parameters:
        - $ref: "#/components/parameters/instance"
      responses:
        "200":
          description: Estado
          content:
            application/json:
              schema:
                type: object
                properties:
                  instance:
                    type: object
                    properties:
                      instanceName: { type: string }
                      state: { type: string, enum: [open, close, connecting] }
        "403": { $ref: "#/components/responses/EvoInvalidKey" }
        "404": { $ref: "#/components/responses/EvoNotFound" }

  /instance/logout/{instance}:
    post:
      tags: [Evolution]
      summary: Desconecta a instância (mantém para novo pareamento)
      security:
        - apiKeyHeader: []
      parameters:
        - $ref: "#/components/parameters/instance"
      responses:
        "200":
          description: Desconectada
          content:
            application/json:
              schema:
                type: object
                properties:
                  instance:
                    type: object
                    properties:
                      instanceName: { type: string }
                      status: { type: string, enum: [logout] }
        "403": { $ref: "#/components/responses/EvoInvalidKey" }
        "404": { $ref: "#/components/responses/EvoNotFound" }
        "500": { $ref: "#/components/responses/EvoInternal" }

  /instance/reconnect/{instance}:
    post:
      tags: [Evolution]
      summary: Reconecta a instância
      security:
        - apiKeyHeader: []
      parameters:
        - $ref: "#/components/parameters/instance"
      responses:
        "200":
          description: Reconexão iniciada
          content:
            application/json:
              schema:
                type: object
                properties:
                  instance:
                    type: object
                    properties:
                      instanceName: { type: string }
                      status: { type: string, enum: [connecting] }
        "403": { $ref: "#/components/responses/EvoInvalidKey" }
        "404": { $ref: "#/components/responses/EvoNotFound" }
        "500": { $ref: "#/components/responses/EvoInternal" }

  /instance/{instance}:
    delete:
      tags: [Evolution]
      summary: Exclui a instância
      security:
        - apiKeyHeader: []
      parameters:
        - $ref: "#/components/parameters/instance"
      responses:
        "200":
          description: Excluída (status "deleted")
          content:
            application/json:
              schema:
                type: object
                properties:
                  instance:
                    type: object
                    properties:
                      instanceName: { type: string }
                      status: { type: string, enum: [deleted] }
        "403": { $ref: "#/components/responses/EvoInvalidKey" }
        "404": { $ref: "#/components/responses/EvoNotFound" }
        "500": { $ref: "#/components/responses/EvoInternal" }

  /message/sendText/{instance}:
    post:
      tags: [Evolution]
      summary: Envia texto
      security:
        - apiKeyHeader: []
      parameters:
        - $ref: "#/components/parameters/instance"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [number, text]
              properties:
                number: { type: string }
                text: { type: string }
                textMessage:
                  type: object
                  description: Alternativa ao campo text
                  properties:
                    text: { type: string }
                delay: { type: integer, description: Espera N ms antes de enviar }
                linkPreview: { type: boolean }
                mentionsEveryOne: { type: boolean }
                mentioned:
                  type: array
                  items: { type: string }
      responses:
        "201": { $ref: "#/components/responses/EvoMessage" }
        "400": { $ref: "#/components/responses/EvoBadRequest" }
        "403": { $ref: "#/components/responses/EvoInvalidKey" }
        "404": { $ref: "#/components/responses/EvoNotFound" }
        "500": { $ref: "#/components/responses/EvoInternal" }

  /message/sendMedia/{instance}:
    post:
      tags: [Evolution]
      summary: Envia mídia (base64 ou URL)
      description: |
        Com `mediatype: audio` e `ptt: true` o servidor converte o arquivo em
        OGG/Opus (ffmpeg) para virar nota de voz reproduzível no Android.
      security:
        - apiKeyHeader: []
      parameters:
        - $ref: "#/components/parameters/instance"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [number, media]
              properties:
                number: { type: string }
                mediatype: { type: string, default: image, enum: [image, video, audio, document, sticker] }
                media: { type: string, description: base64 ou URL http(s) }
                caption: { type: string }
                fileName: { type: string }
                ptt: { type: boolean }
                gifPlayback: { type: boolean }
                delay: { type: integer }
                seconds: { type: integer }
      responses:
        "201": { $ref: "#/components/responses/EvoMessage" }
        "400": { $ref: "#/components/responses/EvoBadRequest" }
        "403": { $ref: "#/components/responses/EvoInvalidKey" }
